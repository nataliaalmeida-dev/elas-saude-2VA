<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Elas Saúde — Cadastrar paciente</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="layout">
  <main class="card-container">
    <section class="brand">
      <div class="logo">
		<img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Elas Saúde — logo" class="logo-img" />
		<h1 id="title">Elas Saúde</h1>
	  </div>
      <p class="tagline">Cuidando da saúde da mulher com praticidade e acolhimento</p>
    </section>

    <section class="panel">
      <form id="registerForm" class="form" method="POST" action="{{ url_for('main.cadastrar') }}" enctype="multipart/form-data" novalidate>
        <h2>Cadastrar paciente</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="background-color: #ffebee; color: #d32f2f; padding: 12px; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; text-align: center; border: 1px solid #ffcdd2;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <label for="foto">Foto de Perfil (Opcional)</label>
        <input id="foto" name="foto" type="file" accept="image/*" style="margin-bottom: 1rem; border: none; padding: 0;">

        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required placeholder="Nome completo">

        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" type="text" inputmode="numeric" required placeholder="000.000.000-00">

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required>

        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" placeholder="(99) 99999-9999">

        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="date">

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" minlength="6" required>

        <label for="senha2">Repita a Senha</label>
        <input id="senha2" name="senha2" type="password" minlength="6" required>

        <div class="row-between">
          <a href="{{ url_for('main.index') }}" class="link">Voltar</a>
          <button type="submit" class="btn primary">Cadastrar</button>
        </div>

      </form>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
